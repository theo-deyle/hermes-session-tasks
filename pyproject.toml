[project]
name = "hermes-session-tasks"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "fastapi==0.133.1",
    "starlette==1.3.1",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.10",
    "pyright==1.1.414",
]

[tool.uv]
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plugin", "tests"]
addopts = "--import-mode=importlib --strict-markers"
filterwarnings = ["error"]
markers = ["hermes: needs the hermes-agent checkout (HERMES_AGENT_REPO); skipped when absent"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".planning", ".venv*"]
preview = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "PLW1514"]
explicit-preview-rules = true
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.11"
include = ["plugin", "tests", "scripts"]
extraPaths = ["plugin", "tests"]
venvPath = "."
venv = ".venv"
