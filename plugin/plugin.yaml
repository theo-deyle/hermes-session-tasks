name: hermes-session-tasks
version: 0.1.0
description: A per-session task board. The agent adds what the user must do, decide or remember; the user edits the items in a Hermes Desktop pane.
requires_hermes: ">=0.22.5"
provides_tools:
  - board_read
  - board_edit
  - board_sessions
  - board_copy
provides_hooks:
  - pre_tool_call
  - post_compaction
  - pre_llm_call
  - on_session_delete
